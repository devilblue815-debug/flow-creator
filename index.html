<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Creator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 10px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 15px; }
    button { flex: 1; padding: 12px; border: none; background: #1a73e8; color: white; border-radius: 8px; font-weight: bold; }
    .btn-danger { background: #d93025; }
    .canvas { min-height: 400px; background: #fff; border: 2px dashed #bbb; border-radius: 10px; padding: 10px; }
    .node { background: #e8f0fe; border: 1px solid #1a73e8; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h2>Flow Creator 🌿</h2>
  <div class="toolbar">
    <button onclick="addNode()">+ إضافة خطوة</button>
    <button onclick="clearCanvas()" class="btn-danger">مسح الكل</button>
  </div>
  <div id="canvas" class="canvas"></div>

  <script>
    let stepCount = 0;
    function addNode() {
      stepCount++;
      const canvas = document.getElementById('canvas');
      const node = document.createElement('div');
      node.className = 'node';
      node.innerHTML = `<span>الخطوة ${stepCount}: عنصر تدفق جديد</span> <button onclick="this.parentElement.remove()" style="background:none;border:none;color:#d93025;font-weight:bold;">✕</button>`;
      canvas.appendChild(node);
    }
    function clearCanvas() {
      document.getElementById('canvas').innerHTML = '';
      stepCount = 0;
    }
  </script>
</body>
</html>
