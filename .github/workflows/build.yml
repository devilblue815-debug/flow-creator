name: Build Flow Creator APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Setup Java JDK
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Accept Android SDK Licenses
run: |
yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
​- name: Prepare Project & Capacitor Config
run: |
mkdir -p www
cp index.html www/
npm init -y
npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
cat << 'EOF' > capacitor.config.json
{
"appId": "com.example.flowcreator",
"appName": "Flow Creator",
"webDir": "www"
}
EOF
npx cap add android
npx cap sync android
​- name: Build APK via Gradle
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: FlowCreator-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
