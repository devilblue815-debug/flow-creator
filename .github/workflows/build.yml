name: Build Flow Creator APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Setup Java JDK
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Prepare Web Assets & Capacitor
run: |
mkdir -p www
cp index.html www/
npm init -y
npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
npx cap init "Flow Creator" "com.example.flowcreator" --web-dir www
npx cap add android
npx cap copy android
​- name: Build APK via Gradle
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: FlowCreator-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
